<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="60">
  <title>ALLMYGEAR — регламентные работы</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1514;
      color: #f3f7f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 10%, rgba(72, 146, 128, 0.22), transparent 34rem),
        radial-gradient(circle at 90% 90%, rgba(38, 86, 78, 0.28), transparent 32rem),
        #0b1514;
    }

    main {
      width: min(620px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid rgba(177, 214, 205, 0.16);
      border-radius: 28px;
      background: rgba(17, 34, 31, 0.9);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .brand {
      margin: 0 0 40px;
      color: #b9dacf;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.24em;
    }

    .status-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      color: #b9e4d7;
      background: linear-gradient(145deg, rgba(86, 167, 145, 0.24), rgba(56, 113, 100, 0.12));
      border: 1px solid rgba(157, 218, 201, 0.2);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .message {
      max-width: 470px;
      margin: 22px auto 0;
      color: #b5c6c1;
      font-size: clamp(16px, 2.5vw, 19px);
      line-height: 1.65;
    }

    .status {
      width: fit-content;
      margin: 32px auto 0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 999px;
      background: rgba(5, 16, 14, 0.52);
      color: #d6e6e1;
      font-size: 14px;
    }

    .status::before {
      width: 9px;
      height: 9px;
      content: "";
      border-radius: 50%;
      background: #83d1b9;
      box-shadow: 0 0 0 5px rgba(131, 209, 185, 0.12);
    }

    .hint {
      margin: 24px 0 0;
      color: #718680;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">ALLMYGEAR</p>
    <div class="status-icon" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
        <path d="M14.7 6.3a4 4 0 0 0-5-5L12 3.6 9.6 6 7.3 3.7a4 4 0 0 0 5 5l7.1 7.1a2.1 2.1 0 0 1-3 3l-7.1-7.1a4 4 0 0 0-5-5L6.6 9 4.2 11.4 1.9 9.1a4 4 0 0 0 5 5l7.1 7.1a4.1 4.1 0 0 0 5.8-5.8L14.7 10.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Ведутся регламентные работы</h1>
    <p class="message">
      Мы обновляем сервис и временно закрыли доступ, чтобы сохранить целостность ваших данных.
      Страница откроется автоматически после завершения работ.
    </p>
    <div class="status">Сервис временно недоступен</div>
    <p class="hint">Страница проверяет доступность сервиса каждую минуту.</p>
  </main>
</body>
</html>
